name: Custoden Check
description: Check new and changed dependencies, workflows and CI files for malware and secret theft, and stop other runs when something is found.
author: Custoden
branding:
  icon: shield
  color: blue

inputs:
  fail-on:
    description: 'Fail when a package verdict is this or worse: malicious, suspicious, review or never.'
    default: suspicious
  workflow-fail-on:
    description: 'Fail when a workflow or CI file finding has this severity or higher: critical, high, medium, low or never.'
    default: high
  fail-on-incomplete:
    description: Fail when some packages or workflows could not be checked, for example because the rate limit was reached.
    default: 'false'
  packages:
    description: Check new and changed versions in lockfiles.
    default: 'true'
  workflows:
    description: Analyze new and changed files in .github/workflows.
    default: 'true'
  ci-files:
    description: Analyze new and changed files that run during CI, such as package.json, conftest.py, setup.py, Makefiles and shell scripts.
    default: 'true'
  cancel-runs:
    description: When the check fails, cancel other workflow runs for the same commit. Requires actions write permission.
    default: 'false'
  comment:
    description: Post the results as a pull request comment. Requires pull-requests write permission.
    default: 'false'
  max-packages:
    description: Most packages to check in one run. The rest are reported as not checked.
    default: '50'
  github-token:
    description: Token used to read files at the base commit and to post the comment.
    default: ${{ github.token }}
  api-url:
    description: Custoden API base URL.
    default: https://api.custoden.com

outputs:
  result:
    description: pass or fail.
  packages-checked:
    description: Number of packages checked.
  workflows-checked:
    description: Number of workflows analyzed.
  files-checked:
    description: Number of CI files analyzed.
  findings:
    description: Number of flagged packages plus workflow and CI file findings.
  cancelled-runs:
    description: Number of other workflow runs that were cancelled.
  report:
    description: Path to the full JSON report.

runs:
  using: node24
  main: src/index.js
